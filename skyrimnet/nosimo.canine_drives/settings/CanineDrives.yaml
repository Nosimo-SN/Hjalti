    # --- Runes ---------------------------------------------------------------------------------------
    - name: "Runes"
      path: "runes.enabled"
      type: "bool"
      description: "Hjalti (SN_Dog) gains runes on his coat from dragon souls: each soul the player takes while he is close by counts, and every few of them works another rune in (forelegs, then hind legs, brow, back). The runes stay dark and light up at moments."
      defaultValue: true
      category: "Runes"

    - name: "Souls per Rune"
      path: "runes.souls_per_unlock"
      type: "int"
      description: "The first rune and soul gift come with the first dragon soul he witnesses; each further one needs this many more (default 2: souls 1, 3, 5, 7...). Four runes; seven gifts (the last at 13 souls by default)."
      defaultValue: 2
      min: 1
      max: 20
      category: "Runes"

    - name: "Bystanders React"
      path: "runes.witness"
      type: "bool"
      description: "When he witnesses a dragon soul taken, the nearest person who can see him (a stranger before one of your companions) is the one who reacts to the narration. Off: SkyrimNet picks, which in practice is usually him or whoever you face."
      defaultValue: true
      category: "Runes"

    - name: "Soul Gifts"
      path: "runes.gifts"
      type: "bool"
      description: "Gifts from the dragon souls he witnesses, one with each rune step: Frost Bite (his bite chills and slows; stronger at the fourth and sixth steps), then Perseverance (badly hurt, the runes knit his wounds), then Frost Step (he crosses a gap in an instant). Quicker cooldowns come at the fifth step, and Frost Howl (he knocks down the foes around him) at the seventh."
      defaultValue: true
      category: "Runes"

    - name: "Perseverance Heal"
      path: "runes.persevere_heal"
      type: "float"
      description: "Perseverance (second gift): when he falls to a fifth of his health in a fight, or goes down, the runes knit this much of his health back (percent) over five seconds."
      defaultValue: 40.0
      min: 5.0
      max: 100.0
      category: "Runes"

    - name: "Perseverance Cooldown"
      path: "runes.persevere_cooldown"
      type: "float"
      description: "Seconds before Perseverance can come again (shorter from the fifth gift on)."
      defaultValue: 120.0
      min: 10.0
      max: 1200.0
      category: "Runes"

    - name: "Frost Step"
      path: "runes.frost_step"
      type: "bool"
      description: "Third gift. In a fight he can cross a gap in an instant: behind a foe he can see far off, or to your side when he falls to 30% health. He only lands on solid ground with a clear line from where he's going."
      defaultValue: true
      category: "Runes"

    - name: "Frost Step Cooldown"
      path: "runes.frost_step_cooldown"
      type: "float"
      description: "Seconds before he can Frost Step at a foe again (shorter from the fifth gift on)."
      defaultValue: 30.0
      min: 5.0
      max: 600.0
      category: "Runes"

    - name: "Frost Step Escape Cooldown"
      path: "runes.frost_step_escape_cooldown"
      type: "float"
      description: "Seconds before he can Frost Step to your side again (shorter from the fifth gift on)."
      defaultValue: 90.0
      min: 10.0
      max: 1200.0
      category: "Runes"

    - name: "Frost Howl"
      path: "runes.frost_howl"
      type: "bool"
      description: "Seventh gift. When two or more foes are close around him, or one is close while he is badly hurt, he howls, frost bursts from him, and every foe within about 300 units is knocked down where they stand. Only foes: never you, your companions, bystanders or children. No damage; it buys him a moment while they get up."
      defaultValue: true
      category: "Runes"

    - name: "Frost Howl Cooldown"
      path: "runes.frost_howl_cooldown"
      type: "float"
      description: "Seconds before he can Frost Howl again (shorter from the fifth gift on)."
      defaultValue: 90.0
      min: 10.0
      max: 1200.0
      category: "Runes"

    - name: "Frost Howl Force"
      path: "runes.frost_howl_force"
      type: "float"
      description: "How hard the howl shoves them. Near 0 they fall where they stand; higher throws them back. If they don't go down at all, raise it a little."
      defaultValue: 2.0
      min: 0.0
      max: 50.0
      category: "Runes"

    - name: "Rune Glow Strength"
      path: "runes.max_glow"
      type: "float"
      description: "How bright the runes glow at their strongest, when he witnesses a dragon soul taken. Everything else lights them less: a soul gift, a power attack, a threat on the air, a song, and faintly while he fights. 0 = never glow."
      defaultValue: 3.0
      min: 0.0
      max: 10.0
      category: "Runes"

    # --- Debug ---------------------------------------------------------------------------------------
    - name: "Log Barks"
      path: "debug.log_barks"
      type: "bool"
      description: "Write each idle he starts and each bark or sound animation event to CanineDrives.log, to trace where a bark came from."
      defaultValue: true
      category: "Debug"

    - name: "Log Combat"
      path: "debug.log_combat"
      type: "bool"
      description: "Write his fights to CanineDrives.log: the hits he takes (one line per attacker and weapon or spell each second), each attack he swings, and his combat state once a second."
      defaultValue: false
      category: "Debug"

    - name: "Log Drives"
      path: "debug.log_changes"
      type: "bool"
      description: "Write the drives to CanineDrives.log (next to skse64.log) every game hour."
      defaultValue: false
      category: "Debug"

    - name: "Set Drives"
      path: "debug.set"
      type: "string"
      description: "For testing: e.g. hunger=80, tired=90 (or all=50). Applied once each time you change this text while playing. graph <label> (e.g. graph lying) writes his animation state to the log instead. bark makes him bark now; bark sound plays only the husky bark sound. sleep makes him nap now (the style picked as usual); sleep relax, sleep guarded or sleep cold forces that sleep style for this nap. playbow makes him play bow now; wiggle does the happy wiggle; rollover has him roll right over; tilt does the curious head tilt; sniffground has him nose the ground; sniffair has him sample the air; sneeze makes him sneeze; happybark, angrybark, growl, pout or sadwhine has him voice that; sneeze sound, sniff sound, big sniff sound, bark sound, angry bark sound, growl sound, whine sound, eat sound, frost step sound, frost howl sound or perseverance sound plays only that sound; pitch 1.2 plays his voice at that pitch (pitch off: his level's again); pose relax, pose guarded or pose cold has him lie in that pose, awake."
      defaultValue: ""
      category: "Debug"
